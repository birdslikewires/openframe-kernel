name: kernel-build-publish
run-name: kernel build and publish ${{ inputs.kernel_version }}

on:
  workflow_call:
    inputs:
      kernel_version:
        required: true
        type: string
      package_revision:
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel version to build (e.g. 6.1.167)'
        required: true
        type: string
      package_revision:
        description: 'Package revision (e.g. 3 for 6.18.63-3); empty for one above the last in the apt repository'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  pages: write

concurrency:
  group: build-kernel
  cancel-in-progress: false

jobs:

  build:
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      KERNEL_VERSION: ${{ inputs.kernel_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y \
            curl git gnupg gh gcc libc6-dev gcc-i686-linux-gnu bc libssl-dev libssl-dev:i386 libelf-dev flex bison \
            debhelper dpkg-dev rsync libncurses-dev apt-utils kmod cpio lsb-release libdw-dev python3 zstd

      - name: Checkout apt repository
        uses: actions/checkout@v7
        with:
          ref: repo
          path: apt-repo

      # One above the last revision in the apt repository, or the one asked for, which must
      # be higher still (a revision is never reused).
      - name: Determine package revision
        env:
          WANTED_REVISION: ${{ inputs.package_revision }}
        run: |
          KCOMPONENT=$(echo "${KERNEL_VERSION}" | cut -d. -f1-2)
          POOL="apt-repo/pool/${KCOMPONENT}"
          LAST_REV=$(ls "${POOL}/linux-image-${KERNEL_VERSION}-openframe_${KERNEL_VERSION}-"*.deb 2>/dev/null \
            | grep -oP '(?<='"${KERNEL_VERSION}"'-)\d+(?=_i386\.deb)' | sort -n | tail -1)
          PKG_REVISION=$(( ${LAST_REV:-0} + 1 ))
          if [ -n "${WANTED_REVISION}" ]; then
            case "${WANTED_REVISION}" in
              *[!0-9]*|0*) OK=0 ;;
              *) [ "${WANTED_REVISION}" -ge "${PKG_REVISION}" ] && OK=1 || OK=0 ;;
            esac
            if [ "${OK}" != 1 ]; then
              echo "Package revision '${WANTED_REVISION}' must be a number of at least ${PKG_REVISION}."
              exit 1
            fi
            PKG_REVISION="${WANTED_REVISION}"
          fi
          echo "Package revision: ${PKG_REVISION}"
          echo "PKG_REVISION=${PKG_REVISION}" >> $GITHUB_ENV

      - name: Cache kernel tarball
        uses: actions/cache@v6
        with:
          path: linux-${{ inputs.kernel_version }}.tar.xz
          key: kernel-tarball-${{ inputs.kernel_version }}

      - name: Download kernel source
        run: |
          if [ ! -f "linux-${KERNEL_VERSION}.tar.xz" ]; then
            MAJOR=$(echo "${KERNEL_VERSION}" | cut -d. -f1)
            curl -fO --retry 3 --retry-delay 5 \
              "https://cdn.kernel.org/pub/linux/kernel/v${MAJOR}.x/linux-${KERNEL_VERSION}.tar.xz"
          fi
          if [ ! -d "linux-${KERNEL_VERSION}" ]; then
            tar xf "linux-${KERNEL_VERSION}.tar.xz"
          fi

      - name: Apply patches
        run: |
          KBRANCH=$(echo "${KERNEL_VERSION}" | cut -d. -f1-2)
          for patch in "patches/${KBRANCH}/"*.patch; do
            echo "Applying ${patch}..."
            patch --fuzz=3 -p1 -d "linux-${KERNEL_VERSION}" < "${patch}"
          done

      # The OpenFrame's firmware hub driver (/dev/fh, /dev/fhp), from this repository's fh/,
      # built with the kernel as a module so linux-image ships it and 'modprobe fh' just
      # works. It only reads unless loaded with writable=1 (fh/README.md), so one without that
      # guard is refused, and its write guards are tested against a fake chip first.
      - name: Test the firmware hub module's write guards
        run: |
          cc -I fh/test -include kstub.h -o /tmp/test_guards fh/test/test_guards.c
          /tmp/test_guards

      - name: Add the firmware hub module
        run: |
          D="linux-${KERNEL_VERSION}/drivers/misc"
          cp fh/fh.c "${D}/fh.c"
          sha256sum "${D}/fh.c"
          if ! grep -q 'module_param(writable' "${D}/fh.c"; then
            echo "fh.c has no writable=1 guard; not shipping it."
            exit 1
          fi
          printf '\nconfig OPENFRAME_FH\n\ttristate "OpenFrame firmware hub (EFI flash) access"\n\tdepends on X86_32\n\thelp\n\t  /dev/fh reads the OpenFrame firmware hub chip and /dev/fhp programs it\n\t  without erasing; writing needs the module loaded with writable=1.\n' >> "${D}/Kconfig"
          echo 'obj-$(CONFIG_OPENFRAME_FH) += fh.o' >> "${D}/Makefile"

      - name: Configure kernel
        run: |
          KBRANCH=$(echo "${KERNEL_VERSION}" | cut -d. -f1-2)
          cp "configs/${KBRANCH}-openframe.config" "linux-${KERNEL_VERSION}/.config"
          make -C "linux-${KERNEL_VERSION}" \
            ARCH=i386 \
            CROSS_COMPILE=i686-linux-gnu- \
            LOCALVERSION=-openframe \
            olddefconfig

      # DEBFULLNAME/DEBEMAIL name the packages' maintainer (otherwise the build container's root).
      - name: Build kernel packages
        env:
          DEBFULLNAME: OpenFrame Project
          DEBEMAIL: noreply@openbeak.net
        run: |
          make -C "linux-${KERNEL_VERSION}" \
            ARCH=i386 \
            CROSS_COMPILE=i686-linux-gnu- \
            LOCALVERSION=-openframe \
            KDEB_PKGVERSION="${KERNEL_VERSION}-${PKG_REVISION}" \
            -j$(nproc) \
            bindeb-pkg

      # bindeb-pkg also makes linux-libc-dev (the kernel's userspace headers). It isn't
      # published: in this repository it would outrank Debian's own, which glibc is built
      # against and which gets Debian's security updates.
      - name: Collect packages
        run: |
          mkdir -p packages
          mv *.deb packages/
          rm -v packages/linux-libc-dev_*.deb
          ls -lh packages/

      - name: Build metapackage
        run: |
          KBRANCH=$(echo "${KERNEL_VERSION}" | cut -d. -f1-2)
          METAPKG="linux-image-openframe-${KBRANCH}"
          METADIR="metapkg/${METAPKG}"
          mkdir -p "${METADIR}/DEBIAN"
          printf 'Package: %s\nVersion: %s\nArchitecture: i386\nMaintainer: OpenFrame Project <noreply@openbeak.net>\nDescription: OpenFrame kernel metapackage (%s series)\n Tracks the latest OpenFrame Linux %s kernel.\n Install this package to receive kernel updates via apt upgrade.\nDepends: linux-image-%s-openframe\n' \
            "${METAPKG}" "${KERNEL_VERSION}" "${KBRANCH}" "${KBRANCH}" "${KERNEL_VERSION}" \
            > "${METADIR}/DEBIAN/control"
          dpkg-deb --build --root-owner-group "${METADIR}" \
            "packages/${METAPKG}_${KERNEL_VERSION}_i386.deb"

      - name: Import GPG signing key
        run: |
          echo "${{ secrets.APT_SIGNING_KEY }}" | gpg --batch --import

      - name: Update apt repository
        run: |
          KCOMPONENT=$(echo "${KERNEL_VERSION}" | cut -d. -f1-2)
          POOL="apt-repo/pool/${KCOMPONENT}"
          BINARY="apt-repo/dists/trixie/${KCOMPONENT}/binary-i386"
          mkdir -p "${POOL}" "${BINARY}"

          cp packages/*.deb "${POOL}/"

          # Keep only the latest metapackage (prevents apt treating old metapackage
          # versions in the Packages index as downgrade candidates, which would
          # stop apt autoremove from cleaning up old versioned kernels)
          ls "${POOL}/linux-image-openframe-"*.deb 2>/dev/null | sort -rV | tail -n +2 | xargs -r rm -v

          # Keep only the latest version of each versioned package type; older ones
          # remain available from the GitHub releases (sorted by version, as file
          # times all date from the checkout)
          ls "${POOL}/linux-image-"[0-9]*.deb 2>/dev/null | sort -rV | tail -n +2 | xargs -r rm -v
          ls "${POOL}/linux-headers"*.deb 2>/dev/null | sort -rV | tail -n +2 | xargs -r rm -v
          rm -fv "${POOL}/linux-libc-dev"*.deb      # no longer published (see Collect packages)

          # Export public signing key for users (binary dearmored for signed-by)
          gpg --export > apt-repo/key.gpg

          cd apt-repo

          # Generate Packages index for this component
          dpkg-scanpackages --arch i386 "pool/${KCOMPONENT}" \
            > "dists/trixie/${KCOMPONENT}/binary-i386/Packages"
          gzip -9c "dists/trixie/${KCOMPONENT}/binary-i386/Packages" \
            > "dists/trixie/${KCOMPONENT}/binary-i386/Packages.gz"

          # Discover all components and regenerate the Release file
          COMPONENTS=$(ls -d dists/trixie/*/binary-i386 2>/dev/null | awk -F/ '{print $3}' | tr '\n' ' ' | sed 's/ $//')

          # Generate Release file
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="OpenFrame Kernel" \
            -o APT::FTPArchive::Release::Label="OpenFrame Kernel" \
            -o APT::FTPArchive::Release::Suite="trixie" \
            -o APT::FTPArchive::Release::Codename="trixie" \
            -o APT::FTPArchive::Release::Architectures="i386" \
            -o "APT::FTPArchive::Release::Components=${COMPONENTS}" \
            -o APT::FTPArchive::Release::Description="OpenFrame Kernel Packages" \
            release dists/trixie > dists/trixie/Release

          # Sign Release file
          GPG_KEY_ID=$(gpg --list-keys --with-colons | awk -F: '/^pub/{print $5; exit}')
          gpg --batch --yes --default-key "${GPG_KEY_ID}" \
            --clearsign -o dists/trixie/InRelease dists/trixie/Release
          gpg --batch --yes --default-key "${GPG_KEY_ID}" \
            --detach-sign --armor -o dists/trixie/Release.gpg dists/trixie/Release

      - name: Generate directory listing
        run: |
          cd apt-repo
          {
            printf '<!DOCTYPE html>\n<html>\n'
            printf '<head><title>Index of /</title></head>\n'
            printf '<body>\n<h1>Index of /</h1><hr><pre>'

            human_size() {
              local size=$1
              if [ "$size" -ge 1073741824 ]; then
                echo "$((size / 1073741824))G"
              elif [ "$size" -ge 1048576 ]; then
                echo "$((size / 1048576))M"
              elif [ "$size" -ge 1024 ]; then
                echo "$((size / 1024))K"
              else
                echo "$size"
              fi
            }

            for f in pool/*/*.deb; do
              [ -f "$f" ] || continue
              fname=$(basename "$f")
              fsize=$(stat -c '%s' "$f")
              fdate=$(date -d "@$(stat -c '%Y' "$f")" '+%d-%b-%Y %H:%M')
              hsize=$(human_size "$fsize")
              href="${f}"
              namelen=${#fname}
              padlen=$((51 - namelen))
              [ ${padlen} -lt 1 ] && padlen=1
              padding=$(printf '%*s' ${padlen} '')
              printf '\n<a href="%s">%s</a>%s%s  %8s' \
                "${href}" "${fname}" "${padding}" "${fdate}" "${hsize}"
            done

            printf '\n</pre><hr></body>\n</html>\n'
          } > index.html

      - name: Push apt repository
        run: |
          cd apt-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "Publish linux-${KERNEL_VERSION}-openframe"
          git push origin repo

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${KERNEL_VERSION}"
          NOTES="Kernel ${KERNEL_VERSION} with OpenFrame patches, built for Debian Trixie (i386)."

          if gh release view "${TAG}" --repo ${{ github.repository }} >/dev/null 2>&1; then
            gh release upload "${TAG}" \
              --repo ${{ github.repository }} \
              --clobber \
              packages/*.deb
          else
            gh release create "${TAG}" \
              --repo ${{ github.repository }} \
              --title "Linux ${KERNEL_VERSION}-openframe" \
              --notes "${NOTES}" \
              packages/*.deb
          fi

      - name: Delete old GitHub releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo ${{ github.repository }} --limit 100 --json tagName \
            --jq '.[6:][].tagName' | while read -r tag; do
            gh release delete "$tag" --repo ${{ github.repository }} --yes --cleanup-tag
          done

      - name: Dispatch image build in openframe-linux
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          gh api repos/birdslikewires/openframe-linux/dispatches \
            --method POST \
            --field event_type=kernel-released \
            --field client_payload[kernel_version]="${KERNEL_VERSION}"
