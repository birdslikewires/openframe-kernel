name: kernel-build-publish
run-name: kernel build and publish ${{ inputs.kernel_version }}

on:
  workflow_call:
    inputs:
      kernel_version:
        required: true
        type: string
      package_revision:
        required: false
        type: string
        default: ''
      publish:
        required: false
        type: boolean
        default: true
      from_run:
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel version to build (e.g. 6.1.167)'
        required: true
        type: string
      package_revision:
        description: 'Package revision (e.g. 3 for 6.18.63-3); empty for one above the last in the apt repository'
        required: false
        type: string
        default: ''
      publish:
        description: 'Publish (apt repository, GitHub release, image build); off for a test kernel, kept only as this run''s artifact'
        required: false
        type: boolean
        default: true
      config_set:
        description: 'Test kernels only (publish off): config symbols to set on top of configs/, e.g. "B43_BUSES_BCMA_AND_SSB=y B43_BUSES_SSB=n"'
        required: false
        type: string
        default: ''
      from_run:
        description: 'Publish an earlier test kernel instead of building: its run ID (the number in the run''s address). kernel_version must be its version'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  pages: write
  issues: write   # the "ready to test" issue
  actions: read   # an earlier test kernel's artifact (from_run)

concurrency:
  group: build-kernel
  cancel-in-progress: false

jobs:

  # Builds the packages and keeps them, the source tarball and a note of the build (build-info.txt) as the run's artifact: a test kernel's for 14 days, so it can be tried by hand and published as it is (from_run), a published one's only for the publish job. Skipped when publishing an earlier test kernel.
  build:
    if: ${{ inputs.from_run == '' }}
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      KERNEL_VERSION: ${{ inputs.kernel_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y \
            curl git gnupg gh gcc libc6-dev gcc-i686-linux-gnu bc libssl-dev libssl-dev:i386 libelf-dev flex bison \
            debhelper dpkg-dev rsync libncurses-dev apt-utils kmod cpio lsb-release libdw-dev python3 zstd

      - name: Checkout apt repository
        uses: actions/checkout@v7
        with:
          ref: repo
          path: apt-repo

      # One above the last revision in the apt repository, or the one asked for, which must
      # be higher still (a revision is never reused).
      - name: Determine package revision
        env:
          WANTED_REVISION: ${{ inputs.package_revision }}
        run: |
          KCOMPONENT=$(echo "${KERNEL_VERSION}" | cut -d. -f1-2)
          # The last revision in either suite: a kernel rebuilt while it's still in testing (a
          # fix found there) comes out one above, or test units that have it never take the fix
          LAST_REV=$(ls "apt-repo/pool/${KCOMPONENT}/linux-image-${KERNEL_VERSION}-openframe_${KERNEL_VERSION}-"*.deb \
            "apt-repo/pool/testing-${KCOMPONENT}/linux-image-${KERNEL_VERSION}-openframe_${KERNEL_VERSION}-"*.deb 2>/dev/null \
            | grep -oP '(?<='"${KERNEL_VERSION}"'-)\d+(?=_i386\.deb)' | sort -n | tail -1)
          PKG_REVISION=$(( ${LAST_REV:-0} + 1 ))
          if [ -n "${WANTED_REVISION}" ]; then
            case "${WANTED_REVISION}" in
              *[!0-9]*|0*) OK=0 ;;
              *) [ "${WANTED_REVISION}" -ge "${PKG_REVISION}" ] && OK=1 || OK=0 ;;
            esac
            if [ "${OK}" != 1 ]; then
              echo "Package revision '${WANTED_REVISION}' must be a number of at least ${PKG_REVISION}."
              exit 1
            fi
            PKG_REVISION="${WANTED_REVISION}"
          fi
          echo "Package revision: ${PKG_REVISION}"
          echo "PKG_REVISION=${PKG_REVISION}" >> $GITHUB_ENV

      - name: Cache kernel tarball
        uses: actions/cache@v6
        with:
          path: linux-${{ inputs.kernel_version }}.tar.xz
          key: kernel-tarball-${{ inputs.kernel_version }}

      - name: Download kernel source
        run: |
          if [ ! -f "linux-${KERNEL_VERSION}.tar.xz" ]; then
            MAJOR=$(echo "${KERNEL_VERSION}" | cut -d. -f1)
            curl -fO --retry 3 --retry-delay 5 \
              "https://cdn.kernel.org/pub/linux/kernel/v${MAJOR}.x/linux-${KERNEL_VERSION}.tar.xz"
          fi
          if [ ! -d "linux-${KERNEL_VERSION}" ]; then
            tar xf "linux-${KERNEL_VERSION}.tar.xz"
          fi

      - name: Apply patches
        run: |
          KBRANCH=$(echo "${KERNEL_VERSION}" | cut -d. -f1-2)
          for patch in "patches/${KBRANCH}/"*.patch; do
            echo "Applying ${patch}..."
            patch --fuzz=3 -p1 -d "linux-${KERNEL_VERSION}" < "${patch}"
          done

      # The OpenFrame's firmware hub driver (/dev/fh, /dev/fhp), from this repository's fh/,
      # built with the kernel as a module so linux-image ships it and 'modprobe fh' just
      # works. It only reads unless loaded with writable=1 (fh/README.md), so one without that
      # guard is refused, and its write guards are tested against a fake chip first.
      - name: Test the firmware hub module's write guards
        run: |
          cc -I fh/test -include kstub.h -o /tmp/test_guards fh/test/test_guards.c
          /tmp/test_guards

      - name: Add the firmware hub module
        run: |
          D="linux-${KERNEL_VERSION}/drivers/misc"
          cp fh/fh.c "${D}/fh.c"
          sha256sum "${D}/fh.c"
          if ! grep -q 'module_param(writable' "${D}/fh.c"; then
            echo "fh.c has no writable=1 guard; not shipping it."
            exit 1
          fi
          printf '\nconfig OPENFRAME_FH\n\ttristate "OpenFrame firmware hub (EFI flash) access"\n\tdepends on X86_32\n\thelp\n\t  /dev/fh reads the OpenFrame firmware hub chip and /dev/fhp programs it\n\t  without erasing; writing needs the module loaded with writable=1.\n' >> "${D}/Kconfig"
          echo 'obj-$(CONFIG_OPENFRAME_FH) += fh.o' >> "${D}/Makefile"

      # The Broadcom Crystal HD video decoder driver, from this repository's crystalhd/
      # (crystalhd/README.md), for an OpenFrame 2 with the card in its mini PCIe slot. A staging
      # module, as it isn't mainline quality: udev loads it by the card's PCI ID.
      - name: Add the Crystal HD driver
        run: |
          D="linux-${KERNEL_VERSION}/drivers/staging"
          cp -R crystalhd "${D}/crystalhd"
          sed -i '/^endif # STAGING/i source "drivers/staging/crystalhd/Kconfig"\n' "${D}/Kconfig"
          grep -q 'crystalhd/Kconfig' "${D}/Kconfig" || { echo "Couldn't add crystalhd to drivers/staging/Kconfig."; exit 1; }
          echo 'obj-$(CONFIG_CRYSTALHD) += crystalhd/' >> "${D}/Makefile"

      # A test kernel may set symbols on top of the committed configuration (config_set), so a
      # trial never has to change what every published kernel is built with. Each must survive
      # olddefconfig as asked, or the build stops.
      - name: Configure kernel
        env:
          CONFIG_SET: ${{ inputs.config_set }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          KBRANCH=$(echo "${KERNEL_VERSION}" | cut -d. -f1-2)
          K="linux-${KERNEL_VERSION}"
          cp "configs/${KBRANCH}-openframe.config" "${K}/.config"
          if [ -n "${CONFIG_SET}" ]; then
            [ "${PUBLISH}" = false ] || { echo "config_set is for test kernels only: turn publish off."; exit 1; }
            for kv in ${CONFIG_SET}; do
              k=${kv%%=*}; v=${kv#*=}
              case "${k}" in ''|*[!A-Z0-9_]*) echo "config_set: bad symbol in '${kv}'"; exit 1 ;; esac
              case "${v}" in
                y) "${K}/scripts/config" --file "${K}/.config" --enable "${k}" ;;
                m) "${K}/scripts/config" --file "${K}/.config" --module "${k}" ;;
                n) "${K}/scripts/config" --file "${K}/.config" --disable "${k}" ;;
                *) echo "config_set: '${kv}' must be =y, =m or =n"; exit 1 ;;
              esac
            done
          fi
          make -C "${K}" \
            ARCH=i386 \
            CROSS_COMPILE=i686-linux-gnu- \
            LOCALVERSION=-openframe \
            olddefconfig
          for kv in ${CONFIG_SET}; do
            k=${kv%%=*}; v=${kv#*=}
            if [ "${v}" = n ]; then
              ! grep -q "^CONFIG_${k}=" "${K}/.config" || { echo "config_set: ${k} still set after olddefconfig"; exit 1; }
            else
              grep -qx "CONFIG_${k}=${v}" "${K}/.config" || { echo "config_set: CONFIG_${k}=${v} didn't survive olddefconfig"; exit 1; }
            fi
            echo "config_set: ${kv}"
          done

      # The OpenFrame's own drivers must be in the configuration: a patch applied with fuzz in
      # the wrong place, or a Kconfig entry gone missing (olddefconfig silently drops its
      # symbol), would otherwise ship a kernel without the backlight, light sensor or /dev/fh.
      # (brcmsmac too: the OpenFrame 2's BCM43225 Wi-Fi card, which b43 is kept off by building it
      # for SSB cards only. And crystalhd, for the Crystal HD card.)
      - name: Check the OpenFrame drivers are configured
        run: |
          for c in CONFIG_BACKLIGHT_OPENFRAME=y CONFIG_OPENFRAME_ALS=m CONFIG_OPENFRAME_FH=m CONFIG_BRCMSMAC=m CONFIG_CRYSTALHD=m; do
            grep -qx "${c}" "linux-${KERNEL_VERSION}/.config" || { echo "${c} isn't in the configuration."; exit 1; }
          done

      # The source the kernel is built from, for its GitHub release (the GPL's corresponding
      # source): the tree as it is now, upstream with our patches, the fh and Crystal HD drivers
      # and the configuration in .config, before anything is built, with a note of how it's
      # built. Test kernels too, so one can be published as it is.
      - name: Make the source tarball
        run: |
          K="linux-${KERNEL_VERSION}"
          cat > "${K}/OPENFRAME-BUILD.txt" <<EOF
          Linux ${KERNEL_VERSION} for the OpenFrame, package ${KERNEL_VERSION}-${PKG_REVISION}: the source
          as it was built, upstream's with the patches, drivers and configuration (.config) of
          https://github.com/birdslikewires/openframe-kernel at $(git rev-parse HEAD).
          Built on Debian Trixie with:
            make ARCH=i386 CROSS_COMPILE=i686-linux-gnu- LOCALVERSION=-openframe \\
              KDEB_PKGVERSION=${KERNEL_VERSION}-${PKG_REVISION} bindeb-pkg
          EOF
          # Named as the packages are (package_version_arch), so 6.18.65-2 reads as the second
          # build of 6.18.65 rather than something for the OpenFrame 2
          mkdir -p source
          XZ_OPT=-T0 tar -cJf "source/linux-${KERNEL_VERSION}-openframe_${KERNEL_VERSION}-${PKG_REVISION}_source.tar.xz" "${K}"
          rm "${K}/OPENFRAME-BUILD.txt"
          ls -lh source/

      # DEBFULLNAME/DEBEMAIL name the packages' maintainer (otherwise the build container's root).
      - name: Build kernel packages
        env:
          DEBFULLNAME: OpenFrame Project
          DEBEMAIL: noreply@openbeak.net
        run: |
          make -C "linux-${KERNEL_VERSION}" \
            ARCH=i386 \
            CROSS_COMPILE=i686-linux-gnu- \
            LOCALVERSION=-openframe \
            KDEB_PKGVERSION="${KERNEL_VERSION}-${PKG_REVISION}" \
            -j$(nproc) \
            bindeb-pkg

      # bindeb-pkg also makes linux-libc-dev (the kernel's userspace headers). It isn't
      # published: in this repository it would outrank Debian's own, which glibc is built
      # against and which gets Debian's security updates.
      - name: Collect packages
        run: |
          mkdir -p packages
          mv *.deb packages/
          rm -v packages/linux-libc-dev_*.deb
          ls -lh packages/

      # And their modules must be in the package that ships (the backlight is built in).
      - name: Check the OpenFrame modules are packaged
        run: |
          IMG=$(ls packages/linux-image-*-openframe_*.deb | grep -v -- '-dbg_' | head -1)
          # Listed once, into a file (this job's container runs steps with sh, which has no <<<).
          dpkg-deb -c "${IMG}" > /tmp/image-contents.txt
          for m in fh.ko openframe-als.ko brcmsmac.ko crystalhd.ko; do
            grep -q "/${m}\(\.[a-z]*\)\?\$" /tmp/image-contents.txt || { echo "${m} isn't in ${IMG}."; exit 1; }
          done

      - name: Build metapackage
        run: |
          KBRANCH=$(echo "${KERNEL_VERSION}" | cut -d. -f1-2)
          METAPKG="linux-image-openframe-${KBRANCH}"
          METADIR="metapkg/${METAPKG}"
          mkdir -p "${METADIR}/DEBIAN"
          printf 'Package: %s\nVersion: %s\nArchitecture: i386\nMaintainer: OpenFrame Project <noreply@openbeak.net>\nDescription: OpenFrame kernel metapackage (%s series)\n Tracks the latest OpenFrame Linux %s kernel.\n Install this package to receive kernel updates via apt upgrade.\nDepends: linux-image-%s-openframe\n' \
            "${METAPKG}" "${KERNEL_VERSION}" "${KBRANCH}" "${KBRANCH}" "${KERNEL_VERSION}" \
            > "${METADIR}/DEBIAN/control"
          dpkg-deb --build --root-owner-group "${METADIR}" \
            "packages/${METAPKG}_${KERNEL_VERSION}_i386.deb"

      # What the publish job checks before it publishes these packages, from this run or a later one (from_run)
      - name: Note the build
        env:
          CONFIG_SET: ${{ inputs.config_set }}
        run: |
          printf 'kernel_version=%s\npackage_revision=%s\nconfig_set=%s\ncommit=%s\n' "${KERNEL_VERSION}" "${PKG_REVISION}" "${CONFIG_SET}" "$(git rev-parse HEAD)" > build-info.txt
          cat build-info.txt

      # A test kernel (publish off) is only this run's artifact, for trying on a unit by hand (gh run download), so no unit gets it from apt until it's published (from_run).
      - name: Keep the packages as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: kernel-${{ inputs.kernel_version }}${{ !inputs.publish && '-test' || '' }}
          path: |
            packages/*.deb
            source/*.tar.xz
            build-info.txt
          retention-days: ${{ !inputs.publish && 14 || 1 }}

  # Publishes this run's packages, or an earlier test kernel's (from_run) once it has been tried, without building it again.
  publish:
    needs: build
    if: ${{ always() && inputs.publish && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.from_run != '')) }}
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      KERNEL_VERSION: ${{ inputs.kernel_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install publishing tools
        run: |
          apt-get update
          apt-get install -y curl git gnupg gh dpkg-dev apt-utils

      - name: Checkout apt repository
        uses: actions/checkout@v7
        with:
          ref: repo
          path: apt-repo

      - name: Fetch this run's packages
        if: ${{ inputs.from_run == '' }}
        uses: actions/download-artifact@v7
        with:
          name: kernel-${{ inputs.kernel_version }}
          path: built

      - name: Fetch the test kernel's packages
        if: ${{ inputs.from_run != '' }}
        uses: actions/download-artifact@v7
        with:
          name: kernel-${{ inputs.kernel_version }}-test
          path: built
          run-id: ${{ inputs.from_run }}
          github-token: ${{ github.token }}

      # An earlier run's artifact says what it is (build-info.txt) itself, so where it came from is checked with GitHub: this repository's build.yml, run on main, finished, and from the commit its note names.
      - name: Check where the test kernel came from
        if: ${{ inputs.from_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          FROM_RUN: ${{ inputs.from_run }}
        run: |
          case "${FROM_RUN}" in ''|*[!0-9]*) echo "from_run '${FROM_RUN}' isn't a run's number."; exit 1 ;; esac
          read -r WF BRANCH STATUS CONCLUSION SHA < <(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FROM_RUN}" \
            -q '[.path, .head_branch, .status, .conclusion, .head_sha] | @tsv' | tr '\t' ' ')
          [ "${WF}" = .github/workflows/build.yml ] || { echo "Run ${FROM_RUN} is ${WF}, not build.yml."; exit 1; }
          [ "${BRANCH}" = main ] || { echo "Run ${FROM_RUN} ran on ${BRANCH}, not main."; exit 1; }
          [ "${STATUS}" = completed ] && [ "${CONCLUSION}" = success ] || { echo "Run ${FROM_RUN} is ${STATUS}/${CONCLUSION}."; exit 1; }
          COMMIT=$(sed -n 's/^commit=//p' built/build-info.txt)
          [ "${COMMIT}" = "${SHA}" ] || { echo "Its note says commit ${COMMIT}, but the run was of ${SHA}."; exit 1; }

      # Only what's publishable: the version asked for, built from the committed configuration (no config_set), with its source, and a revision above any in either suite (a revision is never reused, and test units that have an older one must take it).
      - name: Check the packages
        run: |
          I=built/build-info.txt
          [ -f "$I" ] || { echo "No build-info.txt: a test kernel built before test kernels could be published. Build it again."; exit 1; }
          cat "$I"
          BUILT=$(sed -n 's/^kernel_version=//p' "$I")
          PKG_REVISION=$(sed -n 's/^package_revision=//p' "$I")
          CONFIG_SET=$(sed -n 's/^config_set=//p' "$I")
          [ "${BUILT}" = "${KERNEL_VERSION}" ] || { echo "That run built ${BUILT}, not ${KERNEL_VERSION}."; exit 1; }
          [ -z "${CONFIG_SET}" ] || { echo "That run set config symbols (${CONFIG_SET}): a trial, not publishable."; exit 1; }
          case "${PKG_REVISION}" in ''|*[!0-9]*) echo "Bad package revision '${PKG_REVISION}'."; exit 1 ;; esac
          ls built/source/linux-${KERNEL_VERSION}-openframe_${KERNEL_VERSION}-${PKG_REVISION}_source.tar.xz >/dev/null || { echo "No source tarball."; exit 1; }
          ls built/packages/linux-image-${KERNEL_VERSION}-openframe_${KERNEL_VERSION}-${PKG_REVISION}_i386.deb >/dev/null || { echo "No linux-image ${KERNEL_VERSION}-${PKG_REVISION}."; exit 1; }
          KCOMPONENT=$(echo "${KERNEL_VERSION}" | cut -d. -f1-2)
          LAST_REV=$(ls "apt-repo/pool/${KCOMPONENT}/linux-image-${KERNEL_VERSION}-openframe_${KERNEL_VERSION}-"*.deb \
            "apt-repo/pool/testing-${KCOMPONENT}/linux-image-${KERNEL_VERSION}-openframe_${KERNEL_VERSION}-"*.deb 2>/dev/null \
            | grep -oP '(?<='"${KERNEL_VERSION}"'-)\d+(?=_i386\.deb)' | sort -n | tail -1)
          [ "${PKG_REVISION}" -gt "${LAST_REV:-0}" ] || { echo "${KERNEL_VERSION}-${PKG_REVISION} isn't above ${KERNEL_VERSION}-${LAST_REV}, already in the apt repository. Build it again."; exit 1; }
          mv built/packages built/source .
          echo "PKG_REVISION=${PKG_REVISION}" >> $GITHUB_ENV
          echo "Publishing ${KERNEL_VERSION}-${PKG_REVISION}"

      # Every OpenFrame apt repository is signed with one key, APT_SIGNING_KEY_OPENFRAME
      # (this repository's own APT_SIGNING_KEY until that is set: the same key). Anything
      # else stops the build before it publishes.
      - name: Import GPG signing key
        env:
          KEY: ${{ secrets.APT_SIGNING_KEY_OPENFRAME || secrets.APT_SIGNING_KEY }}
        run: |
          echo "${KEY}" | gpg --batch --import
          FPR=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^sec/ { s = 1; next } s && /^fpr/ { print $10; s = 0 }')
          [ "${FPR}" = 179C4F02E55F4096D690F3BFED801B683FCE8553 ] || { echo "Signing key ${FPR} is not the OpenFrame apt key"; exit 1; }

      # The testing and released suites (scripts/apt-suite.sh), tested before they're used.
      - name: Test the apt suites
        run: bash tests/test_apt_suite.sh

      # To the testing suite (trixie-testing): test units take it now, every other OpenFrame
      # once it's promoted ("ok" in reply to its issue, promote.yml).
      - name: Update apt repository
        run: |
          bash scripts/apt-suite.sh add "$(echo "${KERNEL_VERSION}" | cut -d. -f1-2)" packages/*.deb
          bash scripts/apt-suite.sh listing

      - name: Push apt repository
        run: |
          cd apt-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "Publish linux-${KERNEL_VERSION}-openframe to testing"
          git push origin repo

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${KERNEL_VERSION}"
          NOTES="Kernel ${KERNEL_VERSION} with OpenFrame patches, built for Debian Trixie (i386). In testing until it's promoted: test units have it, other OpenFrames don't yet."

          if gh release view "${TAG}" --repo ${{ github.repository }} >/dev/null 2>&1; then
            gh release upload "${TAG}" \
              --repo ${{ github.repository }} \
              --clobber \
              packages/*.deb source/*.tar.xz
          else
            # A pre-release until it's promoted (promote.yml makes it the latest release).
            gh release create "${TAG}" \
              --repo ${{ github.repository }} \
              --title "Linux ${KERNEL_VERSION}-openframe" \
              --notes "${NOTES}" --prerelease \
              packages/*.deb source/*.tar.xz
          fi

      - name: Delete old GitHub releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo ${{ github.repository }} --limit 100 --json tagName \
            --jq '.[6:][].tagName' | while read -r tag; do
            gh release delete "$tag" --repo ${{ github.repository }} --yes --cleanup-tag
          done

      - name: Dispatch image build in openframe-linux
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          gh api repos/birdslikewires/openframe-linux/dispatches \
            --method POST \
            --field event_type=kernel-released \
            --field client_payload[kernel_version]="${KERNEL_VERSION}"

      # (The body starts with what's in testing: GitHub's push notification for a new issue
      # shows the start of its body.)
      # Tell Andy: an issue assigned to him (vars.TESTING_ASSIGNEE, or andydvsn), which GitHub sends to the app and
      # by email. "ok" as a reply releases the kernel and its image to every OpenFrame
      # (promote.yml); "no" keeps them back.
      - name: Open the testing issue
        env:
          GH_TOKEN: ${{ github.token }}
          ASSIGNEE: ${{ vars.TESTING_ASSIGNEE || 'andydvsn' }}   # who's told (the repository's owner is an organisation)
        run: |
          R="${{ github.repository }}"
          gh label create testing -R "$R" --color FBCA04 --description "Waiting in testing, reply ok to release, no to keep back" --force >/dev/null
          TITLE="Kernel ${KERNEL_VERSION} is ready to test"
          if gh issue list -R "$R" --label testing --state open --search "in:title \"${TITLE}\"" --json number -q '.[0].number' | grep -q .; then
            echo "Its issue is open already."; exit 0
          fi
          gh issue create -R "$R" --title "$TITLE" --label testing --assignee "$ASSIGNEE" --body "In testing: kernel ${KERNEL_VERSION}-${PKG_REVISION}.

          It's in kernel.openbeak.net's testing suite. Test units (OF-BOOT/settings/test.txt says \`testing=yes\`) install it overnight and restart at about 4am; other OpenFrames don't have it.

          An image with it is building in openframe-linux, as **image build v${KERNEL_VERSION} (testing kernel)**: https://github.com/birdslikewires/openframe-linux/actions/workflows/build.yml (its artifact, when it's done).

          - [ ] Starts from a USB stick
          - [ ] Starts from internal memory (OF1)
          - [ ] Wi-Fi and Ethernet
          - [ ] Touch, backlight, sound
          - [ ] Sprite, and an app or two

          Reply **ok** to release the kernel to every OpenFrame and publish that image as the latest release. Reply **no** to keep them back. (Just the word: anything longer is an ordinary comment.)"
