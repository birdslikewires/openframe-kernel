name: kernel-check
run-name: kernel check

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  issues: write   # build.yml's "ready to test" issue
  actions: read   # build.yml asks for it (an earlier test kernel's artifact)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.version.outputs.should_build }}
      kernel_version: ${{ steps.version.outputs.kernel_version }}
    steps:
      - name: Check for new kernel version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KBRANCH="6.18"

          LATEST=$(curl -fsS https://www.kernel.org/releases.json | \
            jq -r --arg branch "${KBRANCH}." \
            '[.releases[] | select(.version | startswith($branch))] | first | .version')
          # Only a plain version goes on (into tags, packages and other jobs' shell steps).
          if ! [[ "${LATEST}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Couldn't get the latest ${KBRANCH} version from kernel.org (got '${LATEST}')."
            exit 1
          fi

          # Built already if there's a release for it: asked by its tag, not by which release
          # is newest (an older version built by hand would otherwise make every check rebuild
          # the latest). A question GitHub doesn't answer stops here, rather than rebuilding.
          if OUT=$(gh release view "v${LATEST}" --repo "${GITHUB_REPOSITORY}" --json tagName 2>&1); then
            BUILT=yes
          elif grep -qi "not found" <<< "${OUT}"; then
            BUILT=no
          else
            echo "Couldn't ask GitHub whether v${LATEST} is built: ${OUT}"
            exit 1
          fi

          echo "Latest upstream: ${LATEST}"
          echo "Built already: ${BUILT}"

          echo "kernel_version=${LATEST}" >> $GITHUB_OUTPUT

          if [ "${BUILT}" = no ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    uses: ./.github/workflows/build.yml
    with:
      kernel_version: ${{ needs.check.outputs.kernel_version }}
    secrets: inherit

  dispatch:
    needs: check
    if: needs.check.outputs.should_build == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Check if image exists in openframe-linux
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ needs.check.outputs.kernel_version }}"
          if gh release view "${TAG}" --repo birdslikewires/openframe-linux > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Image already exists for ${TAG}, skipping dispatch."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "No image found for ${TAG}, dispatching to openframe-linux."
          fi

      - name: Dispatch image build
        if: steps.image.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          gh api repos/birdslikewires/openframe-linux/dispatches \
            --method POST \
            --field event_type=kernel-released \
            --field client_payload[kernel_version]="${{ needs.check.outputs.kernel_version }}"
